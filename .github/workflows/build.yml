name: Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - "ver/**"

jobs:
  build:  
    runs-on: ubuntu-latest
    if: "!contains(github.event.commits[0].message, '[ci-skip]')"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: 'gradle'
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "Github Actions"
      - name: Apply Patches
        run: ./gradlew applyAllPatches --no-daemon --stacktrace
      - name: Build
        run: ./gradlew build --no-daemon --stacktrace
      - name: Create Mojmap Bundler Jar
        run: ./gradlew createMojmapBundlerJar --no-daemon --stacktrace
      - name: Rebuild on Failure
        if: ${{ failure() }}
        run: |
          ./gradlew clean cleanCache --refresh-dependencies
          ./gradlew applyAllPatches --no-daemon --stacktrace 
          ./gradlew build --no-daemon --stacktrace 
          ./gradlew createMojmapBundlerJar --no-daemon --stacktrace
      - name: Upload Artifacts
        uses: actions/download-artifact@v4
        with:
          name: purpur-bundler-1.21.4-R0.1-SNAPSHOT-mojmap.jar
          path: purpur-server/build/libs/
